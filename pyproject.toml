[project]
name = "local-ai-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anil Yadav", email = "panchithaanil5050@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "ddgs>=9.16.0",
    "groq>=1.7.0",
    "ollama>=0.6.3",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
    "torchvision>=0.29.1",
]

[project.scripts]
local-ai-assistant = "local_ai_assistant:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
